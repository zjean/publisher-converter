name: build-windows

# Produces a single self-contained pub2idml.exe for Windows 10/11 x64.
#
# The native parser is built under MSYS2 UCRT64 (the only Windows
# environment that packages libmspub), then bundled by PyInstaller running
# on a normal Windows Python so the result carries no MSYS2 dependency.
#
# The runner is Windows Server, not Windows 11, but the two share the same
# binary interface for this purpose: UCRT ships with both, and every other
# dependency is bundled. What matters is the isolation test below, which
# runs the executable with MSYS2 and Python removed from PATH — that, not
# the runner's edition, is what proves it will start on a clean machine.

# Third-party actions are pinned to a commit SHA rather than a version tag.
# A tag like v4 is a moving pointer the action's owner can re-point, and
# the product of this workflow is an unsigned executable that strangers are
# told to download and run — so a compromised upstream tag would reach
# users directly. The trailing comment records the human version;
# Dependabot updates both together. PyInstaller is pinned for the same
# reason: it is linked into the bootloader of the shipped binary.
#
# There is deliberately no pull_request trigger. A fork's PR must not be
# able to run this workflow with the release token.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default. Only the publish job below raises this, so the
# build — which runs a compiler, PyInstaller, and every third-party action
# in the pipeline — never holds a token that can write to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2.9.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libmspub

      - name: Record dependency versions
        shell: msys2 {0}
        run: |
          pacman -Q mingw-w64-ucrt-x86_64-libmspub mingw-w64-ucrt-x86_64-librevenge
          gcc --version | head -1

      - name: Build pubdump.exe and collect its DLLs
        shell: msys2 {0}
        run: |
          make
          make dlls
          ls -la bin/

      # Not piped straight into head: pubdump exits 5 when a write to its
      # output fails, and closing the pipe early is exactly that. Capturing
      # the whole stream is also the stronger test — it proves the parser
      # ran to completion rather than only that it started.
      - name: Parser smoke test (inside MSYS2)
        shell: msys2 {0}
        run: |
          ./bin/pubdump.exe "files/Cantico_dei_Cantici.pub" > events.jsonl
          head -3 events.jsonl
          echo "... $(wc -l < events.jsonl) events total"
          tail -1 events.jsonl | grep -q '"endDocument"' || {
            echo "stream did not end with endDocument"; exit 1; }
          rm -f events.jsonl
          echo "parser OK"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # Runs before the bundle: a conversion defect should fail the build
      # rather than get packaged into an executable and published.
      - name: Unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -t . -v

      - name: Bundle with PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.22.0
          pyinstaller --clean --noconfirm pub2idml.spec
          Get-Item dist\pub2idml.exe | Select-Object Name,Length

      - name: Bundle the windowed build
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm pub2idml-gui.spec
          Get-Item dist\pub2idml-gui.exe | Select-Object Name,Length

      # The real test: no MSYS2, no Python, no repo on PATH, run from a
      # different drive location. If anything is missing from the bundle
      # this fails here rather than on a user's machine.
      - name: Verify self-contained (PATH stripped to Windows only)
        shell: pwsh
        run: |
          $isolated = "C:\isolated"
          New-Item -ItemType Directory -Force -Path $isolated | Out-Null
          Copy-Item dist\pub2idml.exe $isolated\
          Copy-Item -Recurse files $isolated\files

          $env:PATH = "C:\Windows\system32;C:\Windows"
          Push-Location $isolated
          .\pub2idml.exe --help | Select-Object -First 3
          .\pub2idml.exe files -o out --log-file run.log -v
          if ($LASTEXITCODE -ne 0) { throw "conversion exited $LASTEXITCODE" }
          Pop-Location

          # PyInstaller can omit Tcl/Tk and still produce an executable
          # that starts, so the check has to build a real widget tree.
          Copy-Item dist\pub2idml-gui.exe $isolated\
          & "$isolated\pub2idml-gui.exe" --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "the windowed build could not create its window ($LASTEXITCODE)"
          }

      - name: Check the output is real
        shell: pwsh
        run: |
          $out = "C:\isolated\out"
          $idml = Get-ChildItem $out -Filter *.idml
          if ($idml.Count -lt 5) { throw "expected 5 .idml, got $($idml.Count)" }
          foreach ($f in $idml) {
            if ($f.Length -lt 2000) { throw "$($f.Name) is suspiciously small" }
          }
          if (-not (Test-Path "$out\conversion-report.csv")) { throw "no report" }
          Write-Host "--- report ---"
          Get-Content "$out\conversion-report.csv"

          # Every .idml must be a valid zip whose first entry is the mimetype.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($f in $idml) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($f.FullName)
            $first = $zip.Entries[0].FullName
            $zip.Dispose()
            if ($first -ne "mimetype") { throw "$($f.Name): first entry is $first" }
          }
          Write-Host "all $($idml.Count) packages structurally valid"

      - name: Check logging works
        shell: pwsh
        run: |
          $log = "C:\isolated\run.log"
          if (-not (Test-Path $log)) { throw "no log file written" }
          $text = Get-Content $log -Raw
          foreach ($needle in @("pub2idml", "frozen bundle: True", "parser:", "finished:")) {
            if ($text -notmatch [regex]::Escape($needle)) { throw "log missing '$needle'" }
          }
          Write-Host "--- log ---"
          Get-Content $log

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\pub2idml.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  pub2idml.exe" | Out-File -Encoding ascii dist\pub2idml.exe.sha256
          Write-Host "SHA256: $hash"

          $guiHash = (Get-FileHash dist\pub2idml-gui.exe -Algorithm SHA256).Hash.ToLower()
          "$guiHash  pub2idml-gui.exe" | Out-File -Encoding ascii dist\pub2idml-gui.exe.sha256
          Write-Host "SHA256: $guiHash"

      - name: Upload executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pub2idml-windows-x64-${{ github.sha }}
          path: |
            dist/pub2idml.exe
            dist/pub2idml.exe.sha256
            dist/pub2idml-gui.exe
            dist/pub2idml-gui.exe.sha256
          if-no-files-found: error

      # Kept even when earlier steps fail: this is the diagnostic trail.
      - name: Upload logs and converted output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: build-diagnostics-${{ github.sha }}
          path: |
            C:\isolated\run.log
            C:\isolated\out\conversion-report.csv
          if-no-files-found: warn

  # Publishing is a separate job purely to contain the write token. It runs
  # only after the build and every check above have passed, does nothing but
  # move two already-built files onto a release, and is the only job in the
  # workflow granted contents: write. Nothing here compiles, installs a
  # dependency, or runs project code.
  #
  # Ubuntu rather than Windows: the artefact is finished by this point, so
  # the runner only needs the gh CLI.
  publish:
    needs: build
    if: >-
      github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the built executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: pub2idml-windows-x64-${{ github.sha }}
          path: dist

      # Cheap guard against publishing an empty or truncated download: the
      # release assets are what users actually run.
      - name: Check the assets arrived intact
        run: |
          set -euo pipefail
          ls -l dist/
          test -s dist/pub2idml.exe
          test -s dist/pub2idml.exe.sha256
          test -s dist/pub2idml-gui.exe
          test -s dist/pub2idml-gui.exe.sha256
          cd dist
          # The checksum file is written by PowerShell, so it carries CRLF;
          # `sha256sum --check` would look for a filename ending in \r.
          expected=$(tr -d '\r' < pub2idml.exe.sha256 | awk '{print $1}')
          actual=$(sha256sum pub2idml.exe | awk '{print $1}')
          echo "expected $expected"
          echo "actual   $actual"
          test "$expected" = "$actual"

          guiExpected=$(tr -d '\r' < pub2idml-gui.exe.sha256 | awk '{print $1}')
          guiActual=$(sha256sum pub2idml-gui.exe | awk '{print $1}')
          echo "expected $guiExpected"
          echo "actual   $guiActual"
          test "$guiExpected" = "$guiActual"

      # Every green build on main replaces a rolling prerelease, so the
      # newest executable always has a stable download URL. Build artifacts
      # expire after 90 days and need a login; release assets do not.
      - name: Publish rolling prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          # This job deliberately has no checkout, so gh cannot infer the
          # repository from a git remote. Naming it explicitly is what lets
          # the job stay source-free.
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          Automatic build of \`${COMMIT}\` on $(date -u +%Y-%m-%d).

          Self-contained Windows 10/11 x64 executable — no Python, no MSYS2,
          no Microsoft Publisher needed. Verified in this build by running
          with PATH stripped to C:\Windows\system32.

          The executable is unsigned, so SmartScreen shows a warning on
          first run: **More info -> Run anyway**.

          Usage and options: see the README.
          NOTES

          # Recreate rather than edit, so the tag follows the newest commit.
          # Checked explicitly rather than `|| true`: blanket-swallowing the
          # delete once hid a misconfiguration here, because a delete that
          # fails for a real reason looks identical to one that had nothing
          # to remove.
          if gh release view latest >/dev/null 2>&1; then
            echo "replacing the existing latest release"
            gh release delete latest --yes --cleanup-tag
          else
            echo "no existing latest release to replace"
          fi
          gh release create latest \
            dist/pub2idml.exe dist/pub2idml.exe.sha256 \
            dist/pub2idml-gui.exe dist/pub2idml-gui.exe.sha256 \
            --prerelease --title "Latest build (main)" --notes-file notes.md \
            --target "$COMMIT"

      # TAG goes through the environment rather than being interpolated into
      # the command line: a git tag may legally contain backticks, '$', ';'
      # and quotes, which the shell would otherwise re-parse.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            dist/pub2idml.exe dist/pub2idml.exe.sha256 \
            dist/pub2idml-gui.exe dist/pub2idml-gui.exe.sha256 \
            --title "pub2idml $TAG" --generate-notes
